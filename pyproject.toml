[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "payrexx"
version = "0.1.0"
description = "Python client for the Payrexx payment API — hosted gateways, transactions, POS terminals (ECR) and webhooks"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Neoservice" }]
keywords = ["payrexx", "payments", "twint", "ecr", "pos", "switzerland", "nexgo"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]
dependencies = ["requests>=2.25"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "responses>=0.23", "mypy>=1.5", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/neoserviceai/payrexx-python"
Issues = "https://github.com/neoserviceai/payrexx-python/issues"
"Payrexx API docs" = "https://developers.payrexx.com/reference/rest-api"

[tool.hatch.build.targets.wheel]
packages = ["src/payrexx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --doctest-modules --ignore=tests/test_live.py"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/payrexx"]
