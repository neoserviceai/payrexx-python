site_name: payrexx-python
site_description: Python client for the Payrexx payment API — gateways, transactions, subscriptions, QR bills, payouts, POS terminals and webhooks
site_url: https://neoserviceai.github.io/payrexx-python/
repo_url: https://github.com/neoserviceai/payrexx-python
repo_name: neoserviceai/payrexx-python
edit_uri: edit/main/docs/
copyright: MIT licensed. Not affiliated with Payrexx.

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
  palette:
    # Follows the reader's system setting, with an explicit toggle either way.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            docstring_section_style: table
            members_order: source
            filters: ["!^_"]
            heading_level: 2

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Hosted payment page: guides/hosted-page.md
      - POS terminal (ECR): guides/terminal.md
      - Webhooks: guides/webhooks.md
  - The four traps: traps.md
  - What the docs omit: undocumented.md
  - API reference:
      - Client: reference/client.md
      - Encoding: reference/encoding.md
      - Resources: reference/resources.md
      - Models: reference/models.md
      - Enums: reference/enums.md
      - Webhooks: reference/webhook.md
      - Errors: reference/errors.md
